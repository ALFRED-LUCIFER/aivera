packages:
  - apps/*
  - modules/*
  - packages/*
  - tests/*
  - tools/seed
# Build scripts are allow-listed (AGENTS.md 6.4): approve only what needs it.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  '@parcel/watcher': false
  # Testcontainers' optional SSH and protobuf extras: not needed for a local Docker socket.
  cpu-features: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
  # msw's postinstall copies its browser service worker; the Node tests (msw/node) do not need it.
  msw: false
# Time-boxed audit exception (AGENTS.md 6.3): picomatch ReDoS, every version <= 4.0.7 and no patched release on npm yet.
# Only dev tooling pulls it in (Vitest -> Vite, tinyglobby); `pnpm why picomatch --prod -r` finds no production path
# (checked 18 Nov 2026). Owner-approved 18 Nov 2026, expires 31 Dec 2026. Removal: AIV-P0-900 (#197).
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
