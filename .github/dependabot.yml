version: 2
# Weekly on Monday with a 14-day cooldown (a bad or hijacked version is usually pulled by then). Minor and patch grouped;
# majors stay separate PRs and are upgraded deliberately with a browser check (AGENTS.md 6.2).
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      minor-patch: { update-types: [minor, patch] }
    ignore:
      # The Azure Monitor distro's sdk-node builds the production LoggerProvider on sdk-logs 0.221.0 exactly; the scrubber's
      # safety tests must run on that SDK, so only 0.221.x patches (AIV-P1-163). Lift when the distro moves to sdk-logs 3.x.
      - dependency-name: '@opentelemetry/sdk-logs'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      minor-patch: { update-types: [minor, patch] }
