name: pr
# Required checks on main: "web" and "secrets" (ADR-007). Never weaken a step to get green (AGENTS.md 2.7).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only pull requests are cancelled: every main commit gets a full run (AIV-P1-093), so deploy-dev can trust it.
  # A main commit has its own group, because a shared one drops a pending run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit, architecture and integration tests (Testcontainers starts PostgreSQL on the runner's Docker).
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:links
      - run: node --test 'infra/scripts/*.test.mjs'
      - run: pnpm check:guard
      - run: pnpm audit --audit-level high
      # Bicep (infra/): build and lint with the runner's Azure CLI; any linter warning fails (AIV-P0-003).
      - name: bicep
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false --only-show-errors
          az bicep install --version v0.48.1
          az bicep build --file infra/main.bicep --stdout > /dev/null
          lint=$(az bicep lint --file infra/main.bicep 2>&1)
          if [ -n "$lint" ]; then echo "$lint"; exit 1; fi
          # The pilot (AIV-P1-096): placeholders for the values the owner's shell supplies at deploy time.
          IMAGE_TAG=ci ALERT_EMAIL=ci@example.com ENTRA_TENANT_SUBDOMAIN=ci ENTRA_TENANT_ID=ci ENTRA_RECRUITER_CLIENT_ID=ci \
            az bicep build-params --file infra/pilot.bicepparam --stdout > /dev/null

  # Playwright on the @credalent/ui gallery: axe and visual snapshots in light and dark (AIV-P0-025), in four parallel
  # jobs (AIV-P0-929). Each has its own database, so "publish" runs without waiting for "gallery" (playwright.config.ts).
  e2e-shard:
    name: e2e-shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gallery-1, args: --project=gallery --shard=1/3 }
          - { name: gallery-2, args: --project=gallery --shard=2/3 }
          - { name: gallery-3, args: --project=gallery --shard=3/3 }
          - {
              name: publish-unconfigured,
              args: --project=publish --project=catalogue-publish --project=unconfigured --no-deps,
            }
    # The image the Linux baselines are made in (`pnpm e2e:update`), so screenshots compare pixel for pixel. It ships
    # Chromium and its system deps. Pinned by digest; keep the tag equal to @playwright/test in tests/e2e/package.json
    # (tests/e2e/docker.sh reads the image from this line).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    # Sign-in writes identity.user (AIV-P0-009), so the dev server needs a migrated database.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aivera
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: aivera
        options: --health-cmd "pg_isready -U aivera -d aivera" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://aivera_app:local_dev_only@postgres:5432/aivera
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No build scripts: the image has no git for the lefthook hook install, and next dev needs no native builds.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The local-only roles (packages/db/sql/roles.sql), then every module's migrations, as in local development.
      - name: database
        working-directory: packages/db
        run: |
          node --input-type=module -e "import postgres from 'postgres'; import { readFileSync } from 'node:fs'; const sql = postgres(process.env.ADMIN_URL); await sql.unsafe(readFileSync('sql/roles.sql', 'utf8')); await sql.end();"
          node src/cli.ts migrate
        env:
          ADMIN_URL: postgres://aivera:local_dev_only@postgres:5432/aivera
          DATABASE_MIGRATOR_URL: postgres://aivera_migrator:local_dev_only@postgres:5432/aivera
      - run: pnpm e2e ${{ matrix.args }}
      # AIV-P1-092: the built app under the production content security policy, once, in the lightest shard.
      - run: pnpm --filter @credalent/tests-e2e e2e:production
        if: matrix.name == 'publish-unconfigured'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: tests/e2e/playwright-report/
          retention-days: 14

  # The required check "e2e" (ruleset "Required CI on main"): green only when every shard succeeded; a failed, cancelled
  # or skipped shard fails it.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success

  # The cross-workspace leak suite on its own, so a tenancy failure is named in the checks list (AIV-P0-012). It also
  # runs inside "web"; make "tenancy" a required check (owner setting).
  tenancy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/tenancy.test.ts
        working-directory: tests/integration

  # The deploy images build on every pull request, without pushing (AIV-P0-006).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target web . && docker build --target migrate .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
