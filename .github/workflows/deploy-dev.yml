name: deploy-dev
# AIV-P0-006: a manual run from main (Actions > deploy-dev > Run workflow, or `gh workflow run deploy-dev --ref main`)
# builds the images to ghcr.io, migrates, deploys the web app to Azure dev and smoke-tests its public URL; a failed or cancelled smoke test rolls the web app and the worker back. OIDC only:
# no Azure secret in GitHub. Every action is pinned to a commit SHA because this workflow can mint Azure tokens.
# The deploy job waits for the owner to set repository variables AZURE_CLIENT_ID (id-aivera-cicd-dev), AZURE_TENANT_ID
# and AZURE_SUBSCRIPTION_ID after the first Bicep apply (infra/README.md); until then only the images are built.
# Manual only (owner, 20 Nov 2026): main merges many small PRs a day, so dev is deployed when the owner chooses.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGES: ghcr.io/alfred-lucifer/aivera
  RG: rg-medvya-dev-in
  WEB: ca-aivera-web-dev
  WORKER: ca-aivera-worker-dev
  AI_SERVICE: ca-aivera-ai-dev
  JOB: job-aivera-migrate-dev

jobs:
  # AIV-P1-093: only a commit whose pr run (the required checks) succeeded is deployed. Stops before building.
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: pr run is green for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pr --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq 'map(select(.conclusion == "success")) | length')
          if ! [ "$green" -ge 1 ]; then
            echo "pr run not green: not deployed ($GITHUB_SHA; failed, cancelled or still running)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  images:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: build and push web, migrate and worker
        run: |
          for target in web migrate worker; do
            docker build --target "$target" -t "$IMAGES/$target:$GITHUB_SHA" .
            docker push "$IMAGES/$target:$GITHUB_SHA"
          done
      # AIV-P2-068: the Python AI service, from its own folder.
      - name: build and push ai-service
        run: |
          docker build -t "$IMAGES/ai-service:$GITHUB_SHA" apps/backend/ai-service
          docker push "$IMAGES/ai-service:$GITHUB_SHA"

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Forward-only migrations (ADR-004) as aivera_migrator, inside the VNet. A failure stops here: web is untouched.
      - name: migrate
        run: |
          az containerapp job update -g "$RG" -n "$JOB" --image "$IMAGES/migrate:$GITHUB_SHA" -o none
          sh infra/scripts/run-job.sh "$JOB"

      - name: deploy web
        id: web
        run: |
          prev=$(az containerapp show -g "$RG" -n "$WEB" --query 'properties.template.containers[0].image' -o tsv)
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          az containerapp update -g "$RG" -n "$WEB" --image "$IMAGES/web:$GITHUB_SHA" --set-env-vars "COMMIT_SHA=$GITHUB_SHA" -o none

      # After web: the worker runs no migrations and serves no traffic. Skipped until the owner's apply creates it
      # (infra/modules/worker.bicep), so a deploy before that apply does not fail and roll web back.
      - name: deploy worker
        id: worker
        run: |
          if az containerapp show -g "$RG" -n "$WORKER" -o none 2>/dev/null; then
            prev=$(az containerapp show -g "$RG" -n "$WORKER" --query 'properties.template.containers[0].image' -o tsv)
            echo "previous=$prev" >> "$GITHUB_OUTPUT"
            az containerapp update -g "$RG" -n "$WORKER" --image "$IMAGES/worker:$GITHUB_SHA" -o none
          else
            echo "Skipped $WORKER: not created yet (owner's Bicep apply)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # AIV-P2-068: the AI service, after web for the same reason; skipped until the owner's apply creates it
      # (aiServiceAudience set, infra/README.md).
      # shortcut: a revision that never passes /readyz is not detected here (it scales to zero, and the smoke test hits
      # web only); wait for the revision's healthState once the assistant (AIV-P2-028) calls the service.
      - name: deploy ai service
        id: ai
        run: |
          if az containerapp show -g "$RG" -n "$AI_SERVICE" -o none 2>/dev/null; then
            prev=$(az containerapp show -g "$RG" -n "$AI_SERVICE" --query 'properties.template.containers[0].image' -o tsv)
            echo "previous=$prev" >> "$GITHUB_OUTPUT"
            az containerapp update -g "$RG" -n "$AI_SERVICE" --image "$IMAGES/ai-service:$GITHUB_SHA" -o none
          else
            echo "Skipped $AI_SERVICE: not created yet (owner's Bicep apply)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: smoke test
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$WEB" --query properties.configuration.ingress.fqdn -o tsv)
          SMOKE_URL="https://$fqdn" COMMIT="$GITHUB_SHA" node infra/scripts/smoke.mjs

      # Rolls back the images only, web, worker and AI service together: migrations stay applied, so they must be
      # expand-only (ADR-004). The worker and AI service are rolled back only when they existed (a previous image).
      - name: roll back web, worker and ai service
        if: (failure() || cancelled()) && steps.web.outcome == 'success'
        env:
          PREVIOUS: ${{ steps.web.outputs.previous }}
          PREVIOUS_WORKER: ${{ steps.worker.outputs.previous }}
          PREVIOUS_AI: ${{ steps.ai.outputs.previous }}
        # Both updates run even if one fails; the step fails at the end if either did.
        run: |
          rc=0
          if [ -n "$PREVIOUS_AI" ]; then
            if az containerapp update -g "$RG" -n "$AI_SERVICE" --image "$PREVIOUS_AI" -o none; then
              echo "Rolled $AI_SERVICE back to $PREVIOUS_AI (was $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
            else rc=1; fi
          fi
          if [ -n "$PREVIOUS_WORKER" ]; then
            if az containerapp update -g "$RG" -n "$WORKER" --image "$PREVIOUS_WORKER" -o none; then
              echo "Rolled $WORKER back to $PREVIOUS_WORKER (was $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
            else rc=1; fi
          fi
          if az containerapp update -g "$RG" -n "$WEB" --image "$PREVIOUS" --set-env-vars "COMMIT_SHA=${PREVIOUS##*:}" -o none; then
            echo "Rolled $WEB back to $PREVIOUS (was $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
          else rc=1; fi
          exit $rc

      - name: summary
        run: |
          {
            echo "Deployed commit $GITHUB_SHA to Azure dev"
            echo "- web: $IMAGES/web:$GITHUB_SHA"
            echo "- worker: $IMAGES/worker:$GITHUB_SHA"
            echo "- ai-service: $IMAGES/ai-service:$GITHUB_SHA (if created)"
            echo "- migrate: $IMAGES/migrate:$GITHUB_SHA (job $JOB succeeded)"
          } >> "$GITHUB_STEP_SUMMARY"
