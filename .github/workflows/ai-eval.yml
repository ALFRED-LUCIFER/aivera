name: ai-eval
# AIV-P0-029, AIV-P1-093: the AI golden set runs on every pull request (no path filter, so it can be a required check: a
# filtered required check never reports on other PRs) and gates every change to packages/ai, which holds the client, every prompt and the evals
# (ADR-006 point 8) or to the dev model deployment. "ai-eval" scores the recorded answers: deterministic, free, no model
# call. "ai-eval-live" asks the dev AI deployment (synthetic data only, ADR-011) on main and on a manual run only, so no
# pull request can spend tokens or hold the eval identity; it waits for the owner to set AI_EVAL_CLIENT_ID (infra/README.md).
# Never weaken a step or lower a threshold to get green (AGENTS.md 2.7).
on:
  pull_request:
  push:
    branches: [main]
    # Kept filtered: every push to main would otherwise spend the live token cap.
    # apps/backend/ai-service builds the model call for its tasks (AGENTS.md 3.18).
    paths: ['packages/ai/**', 'apps/backend/ai-service/**', 'infra/modules/ai.bicep', '.github/workflows/ai-eval.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eval-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prints every case, writes the summary table to the run's summary page, exits 1 below a threshold.
      # AIV-P1-085: also exits 1 when a case was recorded with another prompt version or request than the code's.
      - run: pnpm ai:eval --out "$RUNNER_TEMP/ai-eval.json"
      # The gate must fail on a bad case, or a green run proves nothing.
      - name: the gate fails on its failing fixtures
        # Exactly 1 (a failed threshold); 2 would be a broken fixture, not the gate.
        run: |
          code=0; pnpm ai:eval --dir evals/fixtures/failing || code=$?
          if [ "$code" -ne 1 ]; then echo "expected the gate to exit 1, got $code"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-eval-${{ github.sha }}
          path: ${{ runner.temp }}/ai-eval.json
          retention-days: 90

  ai-eval-live:
    needs: ai-eval
    # Main and manual runs only: a pull request's code never runs with the eval identity or its token cap.
    if: vars.AI_EVAL_CLIENT_ID != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The identity's federated credential trusts this environment only, and may only call the dev AI deployments.
    environment: ai-eval
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AI_EVAL_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # Capped by liveTokenCap in packages/ai/evals/config.ts.
      - run: pnpm ai:eval --live --out "$RUNNER_TEMP/ai-eval-live.json"
        env:
          APP_ENV: dev
          AZURE_OPENAI_RESOURCE_NAME: ${{ vars.AI_EVAL_RESOURCE_NAME }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-eval-live-${{ github.sha }}
          path: ${{ runner.temp }}/ai-eval-live.json
          retention-days: 90
