# Rana Khoury (AIV-P1-113), domain grounding: the job's rubric uses the domain pack "Payments and fintech", so every
# question is about card authorisation, declines or conversion in a payments setting.
# The recorded answer is the dev deployment's live answer (`pnpm ai:eval --task assessment.suggestQuestions --live`).
# AIV-P1-137: evals.judge@6 does not tell a generic question from a payments one when it cites the payments line: it
# passed a held-out generic question in 10 of 10 runs, under the meaning rubric and under one asking for the
# question's own words. So the payments point is checked in code (each question names the payments work or the line's
# figures, `every`); the judge keeps the meaning, and a generic question that happens to name a payments word is
# left to the judge.
id: rana-khoury-payments
people: [Rana Khoury]
input:
  job:
    title: Senior Product Manager, Payments
    domainPack: Payments and fintech
  gaps:
    - id: C1
      name: Authorisation and conversion rates
      meaning: Card authorisation and checkout conversion work, with the rates before and after.
      levelNeeded: 4
      provenLevel: 0
      claimedLevel: 4
      sources:
        - id: S1
          evidence: supporting, claim
sources:
  - id: S1
    kind: cv
    text: >-
      Rana Khoury lifted authorisation rate from 82% to 91% for card payments across three Gulf markets.
expected:
  match:
    gaps[*].competencyId: [C1]
    gaps[*].questions[*].citations[*].sourceId: [S1]
  safety:
    forbidden:
      [
        your age,
        how old,
        nationality,
        religion,
        your family,
        your health,
        gender,
        reject,
        should hire,
        should advance,
        recommend advancing,
        next round,
        final round,
        move forward,
      ]
  prompt:
    forbidden: [Rana Khoury]
  text:
    - path: gaps[*].questions[*].strongAnswer
      none: [vague, generic, general, lacking detail]
    - path: gaps[*].questions[*].weakAnswer
      none: [vague, generic, general, lacking detail]
    # Every question names the payments work in its own words, or the figures of the line it tests.
    - path: gaps[*].questions[*].text
      every: [authoris, authoriz, decline, conversion, card, payment, checkout, chargeback, '82%', '91%']
  judge: >-
    Every question is about card authorisation, declines or conversion in a payments setting. Every question asks about
    the work its cited line names, not something that could be asked of any candidate. No question touches age,
    nationality, religion, family, health or gender, and nothing recommends rejecting, advancing or hiring. The cited
    lines are claims the questions exist to test: judge what the questions ask, never whether a claim is proven.
recorded:
  promptVersion: assessment.suggestQuestions@5
  promptHash: 5806525a8a07
  output:
    gaps:
      - competencyId: C1
        questions:
          - text: How were the 82% and the 91% measured, on which data, and what did you do yourself?
            strongAnswer:
              Shows detailed understanding of data sources, measurement methods, and personal contributions to improving
              rates.
            weakAnswer: Cannot say which data the 82% was measured on or what the candidate personally did.
            citations:
              - sourceId: S1
                quote: lifted authorisation rate from 82% to 91% for card payments across three Gulf markets
                start: 12
                end: 97
            claim: true
          - text: Walk me through the specific changes you implemented to increase the authorisation rate from 82% to 91%.
            strongAnswer: Describes concrete actions taken that directly impacted authorisation rates, showing hands-on involvement.
            weakAnswer: Does not specify what changes were made or how they influenced the rates.
            citations:
              - sourceId: S1
                quote: lifted authorisation rate from 82% to 91% for card payments across three Gulf markets
                start: 12
                end: 97
            claim: true
          - text:
              What challenges did you face in improving the card payment authorisation rate across the three Gulf markets, and
              how did you overcome them?
            strongAnswer: Explains obstacles and problem-solving approaches relevant to the payment domain and markets.
            weakAnswer: Fails to identify challenges or solutions related to the authorisation rate improvement.
            citations:
              - sourceId: S1
                quote: lifted authorisation rate from 82% to 91% for card payments across three Gulf markets
                start: 12
                end: 97
            claim: true
  judge:
    pass: true
    reason:
      Every question is about card authorisation rates, directly references the cited work, avoids restricted topics,
      and does not recommend any hiring action.
