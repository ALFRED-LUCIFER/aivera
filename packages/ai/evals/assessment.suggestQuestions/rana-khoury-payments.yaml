  prompt:
    forbidden: [Rana Khoury]
  judge: >-
    Check these items in order. First, one item per question for its two notes, written as 'strong: <its strongAnswer>
    | weak: <its weakAnswer>'. A note describes an answer the candidate has not given yet, so for this item sourceSays
    holds the notes' own words that name what an answer shows or lacks (how a figure was measured, the questions or
    data behind it, a system, the candidate's own part), or "nothing". It meets the rubric only if both notes name
    such a thing; a note containing the word "vague" or "generic" does not meet it, whatever follows. Then one item
    per question, written as the question's text; for this item sourceSays holds the question's own words that name
    card authorisation, the authorisation rate, declines, conversion, card payments or the three Gulf markets, or
    "nothing", and "nothing" does not meet the rubric. Every question must be about card authorisation, declines or
    conversion in a payments setting: one about "a recent project" does not meet the rubric. No question touches age,
    nationality, religion, family, health or gender, and none recommends rejecting, advancing or hiring. The cited
    lines are claims the questions exist to test: judge what the questions ask, never whether a claim is proven.
