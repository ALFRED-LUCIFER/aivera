        weight: 10
        level: 3
        type: mandatory
        citations:
          - sourceId: S1
            quote: You will review other engineers' pull requests.
            start: 495
            end: 542
        claim: false
      - name: Design system collaboration
        evidenceExpected: Worked with designers to implement and maintain a design system for consistent UI components.
        weight: 10
        level: 3
