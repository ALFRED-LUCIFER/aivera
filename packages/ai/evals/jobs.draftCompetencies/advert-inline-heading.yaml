# An agency's advert (synthetic): benefits and boilerplate around the work, and a "Nice to have:" label on the same line
# as its first item. Live, @4 quoted the label with the second item ("Nice to have: Experience with ..."), which is not
# in the description, so the whole draft was rejected on both attempts in 5 of 6 runs.
id: advert-inline-heading
input:
  jobType: software_engineering
  title: Senior Frontend Engineer
sources:
  - id: S1
    kind: job_description
    text: |-
      About us: We are a fast-growing, award-winning travel company with offices in 4 countries and a culture of ownership. We offer free lunch, a gym pass, 30 days of leave and annual flights home.
      The role: You will build the booking flow in React and TypeScript and own it in production. You will make pages fast on slow mobile networks and measure it with Core Web Vitals. You will make every screen usable with a keyboard and a screen reader. You will write component tests and end-to-end tests. You will review other engineers' pull requests. You will work with designers on the design system.
      Nice to have: experience with Next.js server rendering. Experience with right-to-left layouts for Arabic.
      We are an equal opportunity employer. Apply now, limited seats!
expected:
  match:
    competencies[*].name:
      - React and TypeScript in production
      - Fast pages on slow mobile networks
      - Keyboard and screen reader accessibility
      - Component and end-to-end tests
      - Code review
      - Design system work with designers
      - Next.js server rendering
      - Right-to-left layouts
    competencies[*].type: [mandatory, desirable]
    suggestions[*].name:
      - Travel booking domain
      - Cross-browser testing
  text:
    - path: competencies[*].name
      none: [lunch, gym, leave, flights, award]
recorded:
  output:
    competencies:
      - name: React and TypeScript development
        evidenceExpected: Built and maintained booking flow components using React and TypeScript, deployed and owned in
          production environments.
        weight: 25
        level: 4
        type: mandatory
        citations:
          - sourceId: S1
            quote: You will build the booking flow in React and TypeScript and own it in production.
            start: 203
            end: 284
        claim: false
      - name: Performance optimization for slow mobile networks
        evidenceExpected: Optimized web pages to load quickly on slow mobile networks, measured and improved Core Web Vitals metrics.
        weight: 15
        level: 4
        type: mandatory
        citations:
          - sourceId: S1
            quote: You will make pages fast on slow mobile networks and measure it with Core Web Vitals.
            start: 285
            end: 370
        claim: false
      - name: Accessibility implementation
        evidenceExpected: Developed user interfaces fully usable with keyboard navigation and screen readers to ensure
          accessibility compliance.
        weight: 15
        level: 4
        type: mandatory
        citations:
          - sourceId: S1
            quote: You will make every screen usable with a keyboard and a screen reader.
            start: 371
            end: 441
        claim: false
      - name: Component and end-to-end testing
        evidenceExpected: Wrote component tests and end-to-end tests to ensure quality and reliability of frontend features.
        weight: 15
        level: 4
        type: mandatory
        citations:
          - sourceId: S1
            quote: You will write component tests and end-to-end tests.
            start: 442
            end: 494
        claim: false
      - name: Code review and collaboration
        evidenceExpected: Reviewed pull requests from other engineers and collaborated effectively to maintain code quality.
        weight: 10
        level: 3
        type: mandatory
        citations:
          - sourceId: S1
            quote: You will review other engineers' pull requests.
            start: 495
            end: 542
        claim: false
      - name: Design system collaboration
        evidenceExpected: Worked closely with designers to implement and maintain a consistent design system across the product.
        weight: 10
        level: 3
        type: mandatory
        citations:
          - sourceId: S1
            quote: You will work with designers on the design system.
            start: 543
            end: 593
        claim: false
      - name: Next.js server rendering (nice to have)
        evidenceExpected: Implemented server-side rendering features using Next.js to improve performance and SEO.
        weight: 5
        level: 3
        type: desirable
        citations:
          - sourceId: S1
            quote: 'Nice to have: experience with Next.js server rendering.'
            start: 594
            end: 649
        claim: false
    refused: false
    reason: null
    suggestions:
      - name: Web performance monitoring and analytics
        evidenceExpected: Set up and analyzed web performance monitoring tools and analytics to continuously improve user experience.
        weight: 10
        level: 3
        type: desirable
        why:
          The description mentions measuring performance with Core Web Vitals but does not explicitly mention experience with
          monitoring and analytics tools.
        citations:
          - sourceId: S1
            quote: You will make pages fast on slow mobile networks and measure it with Core Web Vitals.
            start: 285
            end: 370
        claim: false
      - name: Internationalization and localization
        evidenceExpected: Developed frontend features supporting multiple languages and layouts, including right-to-left text direction.
        weight: 10
        level: 3
        type: desirable
        why: The description notes experience with right-to-left layouts for Arabic as nice to have, implying
          internationalization skills are relevant but not mandatory.
        citations:
          - sourceId: S1
            quote: 'Nice to have: experience with Next.js server rendering.'
            start: 594
            end: 649
        claim: false
