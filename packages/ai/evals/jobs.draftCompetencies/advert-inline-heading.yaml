            quote: You will work with designers on the design system.
            start: 543
            end: 593
        claim: false
      - name: Next.js server-side rendering (desirable)
        evidenceExpected: Built or maintained web applications using Next.js with server-side rendering capabilities.
        weight: 10
        level: 3
        type: desirable
        citations:
          - sourceId: S1
            quote: 'Nice to have: experience with Next.js server rendering.'
            start: 594
            end: 649
        claim: false
    refused: false
    reason: null
    suggestions:
      - name: Web development in English
        evidenceExpected: Developed frontend applications primarily in English language environments.
        weight: 5
        level: 3
        type: desirable
        why:
          The job involves building user-facing web pages and collaborating with designers, implying English as the working
          language, but the description does not explicitly state it.
        citations:
          - sourceId: S1
            quote: You will build the booking flow in React and TypeScript and own it in production.
            start: 203
            end: 284
        claim: false
      - name: Internationalization and localization
        evidenceExpected:
          Implemented support for multiple languages and layouts in web applications, including right-to-left
          text direction.
        weight: 5
        level: 3
        type: desirable
        why:
          The mention of right-to-left layouts for Arabic implies a need for internationalization skills, but the description
          only lists it as nice to have and does not elaborate.
        citations:
          - sourceId: S1
            quote: 'Nice to have: experience with Next.js server rendering.'
            start: 594
            end: 649
        claim: false
