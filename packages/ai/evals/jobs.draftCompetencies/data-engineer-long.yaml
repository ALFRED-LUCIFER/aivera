# AIV-P1-082: a full-length data description with a responsibilities list and a requirements list, the shape that
# failed on Azure dev (synthetic). Relative weights over 100 in total; the jobs module scales them to 100.
id: data-engineer-long
input:
  jobType: data_ml
  title: 'Data Engineer, Analytics Platform'
sources:
  - id: S1
    kind: job_description
    text: |
      Our analytics platform gives store managers daily sales and stock reports.
      Responsibilities:
      - Build and run batch pipelines in Python and SQL that load sales data into our warehouse every night.
      - Model the warehouse tables that analysts and dashboards query.
      - Add data quality checks so a broken load is caught before a report goes out.
      - Move our slowest pipelines to streaming so stock levels update within minutes.
      - Work with analysts to turn their questions into tables they can use.
      Requirements:
      - Strong SQL and Python.
      - Experience with Airflow or a similar scheduler.
      - Clear written documentation of the tables you own.
expected:
  match:
    competencies[*].name:
      - Batch data pipelines
      - Data modelling
      - Data quality
      - Streaming pipelines
      - Working with analysts
      - Pipeline orchestration
      - Data documentation
    suggestions[*].name:
      - Retail data knowledge
