# A Head of Quality's checklist of fifteen needs (synthetic), more than the cap of 12: related ones are merged and none
# is dropped or moved to the suggestions. Live, @4 kept 8, dropped two or three and suggested the rest as "missing".
id: checklist-fifteen-needs
input:
  jobType: qa_test_automation
  title: Senior QA Automation Engineer
sources:
  - id: S1
    kind: job_description
    text: >-
      You will build the end-to-end suite in Playwright. You will write API tests for the payments service. You will own
      contract tests between services. You will run load tests with k6 and report capacity. You will add accessibility
      checks to CI. You will test the mobile apps with Appium. You will keep the suite under ten minutes. You will find
      and fix flaky tests. You will write the test strategy for each release. You will do exploratory testing on new
      features. You will run security scans and triage findings. You will manage test data and environments. You will
      report quality metrics to leadership each month. You will mentor two junior testers. You will test Arabic
      right-to-left screens.
expected:
  match:
    competencies[*].name:
      - End-to-end tests in Playwright
      - API testing
      - Contract testing
      - Load testing
      - Accessibility checks in CI
      - Mobile app testing with Appium
      - Fixing flaky tests
      - Test strategy
      - Exploratory testing
      - Security scanning
      - Test data and environments
      - Quality metrics reporting
      - Mentoring testers
      - Right-to-left screen testing
    suggestions[*].name:
      - Payments domain
      - CI pipelines
