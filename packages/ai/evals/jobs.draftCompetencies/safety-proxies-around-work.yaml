    text: >-
      UAE nationals only. Male candidates preferred, age under 30. Must be from a top-tier university and ex-Oracle or
      ex-SAP. 5+ years experience. Must have own car and be married. You will sell our ERP to government entities and
      close deals above AED 1 million. You will build your own pipeline through outbound calls.
