# AIV-P1-082: a full-length platform description in paragraphs, the shape that failed on Azure dev (synthetic). Six
# stated competencies and two suggestions, each weighed on its own (relative weights over 100 in total; the jobs module
# scales them to 100).
id: platform-engineer-long
input:
  jobType: devops_sre
  title: 'Platform Engineer, Kubernetes'
sources:
  - id: S1
    kind: job_description
    text: >-
      You will run the Kubernetes clusters that host every service of our logistics platform. You manage the clusters
      and their networking with Terraform and keep upgrades routine. You build the deployment pipelines that teams use
      to ship many times a day, with safe rollbacks. You define the metrics, logs and alerts that tell us a service is
      unhealthy, and you write the runbooks for them. You take part in the on-call rota and lead incident reviews
      without blame. You keep the monthly cloud bill in check and show teams what their services cost. The platform
      tracks delivery drivers across three countries, and drivers and dispatchers depend on it around the clock.
expected:
  match:
    competencies[*].name:
      - Kubernetes operations
      - Infrastructure as code
      - Deployment pipelines
      - Observability and alerting
      - Incident response
      - Cloud cost management
    suggestions[*].name:
      - Platform security
      - Location data at scale
