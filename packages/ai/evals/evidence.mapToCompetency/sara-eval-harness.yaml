# Sara Al Qahtani: her eval harness repository backs Python. Its name alone is no evidence of "Retrieval and evaluation"
# (the prompt's repository rule): from @5 (AIV-P1-157) the model no longer links it on any live run, so c-retrieval is
# not expected (owner, 28 Nov 2026); were it linked, the product would cap it at Supporting (the name is a declaration
# span). Her CV lines stay claims at Supporting or below. Each limit states what the evidence does not show, which only
# a judge can check.
id: sara-eval-harness
people: [Sara Al Qahtani]
input:
  competencies:
    - id: c-llm
      name: LLM systems in production
      evidenceExpected: An assistant or LLM feature running for real users, with its monitoring.
    - id: c-retrieval
      name: Retrieval and evaluation
      evidenceExpected: An eval harness, retrieval metrics or a regression gate the candidate built.
    - id: c-python
      name: Python service engineering
      evidenceExpected: Python services the candidate wrote and maintains, with tests.
    - id: c-cost
      name: Cost and reliability
      evidenceExpected: Cost or latency reductions with the measurement behind them.
    - id: c-arabic
      name: Arabic and bilingual NLP
      evidenceExpected: Arabic or bilingual datasets, models or evaluations.
sources:
  - id: S1
    kind: repo
    text: |-
      llm-eval-harness
      authored 412 of 460 commits
      Skill signal Python: STRONG (code_corroborated)
      Python in src/harness/run.py (path, code): Python source file
      Python in pyproject.toml (manifest, declaration): declares pytest
  - id: S2
    kind: cv
    text: >-
      Sara Al Qahtani, Senior AI Engineer. Led the merchant assistant used by about 9,000 merchants. Cut cost per
      request by 40% with response caching. Built a Gulf Arabic evaluation set for the assistant.
expected:
  match:
    links[*].competencyId: [c-python, c-cost]
    links[*].label: [submitted, claim]
    links[*].strength: [strong, supporting]
  judge: >-
    Every link's limit names what its evidence does not show, such as who reviewed the work, its effect on product
    decisions, or that a CV line has nothing to inspect.
recorded:
  promptVersion: evidence.mapToCompetency@5
  promptHash: da0f9071e1cf
  output:
    links:
      - competencyId: c-llm
        strength: supporting
        label: claim
        level: 3
        limit: This evidence does not show the monitoring or scale of the LLM system beyond the merchant count.
        citations:
          - sourceId: S2
            quote: Led the merchant assistant used by about 9,000 merchants
      - competencyId: c-cost
        strength: supporting
        label: claim
        level: 3
        limit: This evidence does not show the exact measurement methods or reliability improvements.
        citations:
          - sourceId: S2
            quote: Cut cost per request by 40% with response caching
      - competencyId: c-arabic
        strength: supporting
        label: claim
        level: 3
        limit: This evidence does not show the scale or impact of the Arabic evaluation set.
        citations:
          - sourceId: S2
            quote: Built a Gulf Arabic evaluation set for the assistant
      - competencyId: c-python
        strength: strong
        label: submitted
        level: 4
        limit: This evidence does not show the scale or production deployment of the Python services.
        citations:
          - sourceId: S1
            quote: authored 412 of 460 commits
    changes:
      - competencyId: c-retrieval
        text: Provide evidence of building or maintaining an evaluation harness or retrieval metrics for retrieval and
          evaluation competency.
  judge:
    pass: true
    reason: Every link's limit names what its evidence does not show, as required by the rubric.
