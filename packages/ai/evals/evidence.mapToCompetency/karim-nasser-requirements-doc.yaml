    kind: document
    text: |-
      Card checkout retries: product requirements, version 3
      Problem: 4.1% of card checkouts fail on a first-attempt gateway timeout.
      Goal: recover half of them without charging any customer twice.
      Requirement: retry once after 2 seconds with the same idempotency key.
      Acceptance: no duplicate charge in 10,000 replayed timeouts.
