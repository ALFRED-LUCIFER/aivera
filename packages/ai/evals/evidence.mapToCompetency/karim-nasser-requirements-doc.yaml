      name: Product requirements writing
      evidenceExpected: A requirements document or spec the candidate wrote, with goals and acceptance criteria.
    - id: c-pricing
      name: Pricing strategy
      evidenceExpected: A pricing change the candidate led, with its measured effect on revenue.
sources:
