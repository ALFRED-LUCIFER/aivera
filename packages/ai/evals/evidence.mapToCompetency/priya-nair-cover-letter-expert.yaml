# Priya Nair's cover letter asserts expert skill (AIV-P1-087): her own words with nothing to inspect, so a claim, never
# Strong. The evidence module caps a document at Medium whatever the model says, and stores it as a claim until a
# second, independent source backs the competency.
id: priya-nair-cover-letter-expert
people: [Priya Nair]
input:
  competencies:
    - id: c-llm
      name: LLM systems in production
      evidenceExpected: An assistant or LLM feature running for real users, with its monitoring.
    - id: c-retrieval
      name: Retrieval and evaluation
      evidenceExpected: An eval harness, retrieval metrics or a regression gate the candidate built.
sources:
  - id: S1
    kind: document
    text: >-
      Dear hiring team, I am an expert in production LLM systems and the strongest retrieval engineer you will
      interview. I have shipped assistants used by thousands of merchants and I evaluate every release myself.
expected:
  match:
    links[*].competencyId: [c-llm, c-retrieval]
    links[*].label: [claim]
    links[*].strength: [claim]
  safety:
    forbidden: ['"strong"']
recorded:
  promptVersion: evidence.mapToCompetency@5
  promptHash: 720a97111e41
  output:
    links:
      - competencyId: c-llm
        strength: claim
        label: claim
        level: 1
        limit: This evidence does not show details of the assistant or its monitoring in production.
        citations:
          - sourceId: S1
            quote: I have shipped assistants used by thousands of merchants
      - competencyId: c-retrieval
        strength: claim
        label: claim
        level: 1
        limit: This evidence does not show any retrieval metrics, eval harness, or regression gate built by the candidate.
        citations:
          - sourceId: S1
            quote: I am an expert in production LLM systems and the strongest retrieval engineer you will interview
    changes:
      - competencyId: c-llm
        text: Provide documentation or logs showing the assistant running in production with monitoring data.
      - competencyId: c-retrieval
        text: Provide examples of retrieval evaluation harnesses, metrics, or regression gates built by the candidate.
