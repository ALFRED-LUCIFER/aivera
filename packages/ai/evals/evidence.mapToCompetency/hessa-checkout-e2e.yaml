# Hessa Al Mazrouei's checkout-e2e repository maps to "Test automation" on her clear authorship; nothing shows CI
# reliability, so it gets no link and a check instead.
id: hessa-checkout-e2e
people: [Hessa Al Mazrouei]
input:
  competencies:
    - id: c-test
      name: Test automation
      evidenceExpected: An end-to-end or integration suite the candidate wrote and maintains.
    - id: c-ci
      name: CI reliability
      evidenceExpected: CI pipelines the candidate kept green, with their run history.
sources:
  - id: S1
    kind: repo
    text: |-
      checkout-e2e
      authored 148 of 171 commits
expected:
  match:
    links[*].competencyId: [c-test]
    links[*].label: [submitted]
    links[*].strength: [strong]
recorded:
  promptVersion: evidence.mapToCompetency@2
  promptHash: '01ccc63efaaa'
  output:
    links:
      - competencyId: c-test
        strength: strong
        label: submitted
        level: 4
        limit: Shows her share of the commits, not how flaky the suite is or what it covers.
        citations:
          - sourceId: S1
            quote: authored 148 of 171 commits
    changes:
      - competencyId: c-ci
        text: Ask for the suite's CI run history over the last three months.
