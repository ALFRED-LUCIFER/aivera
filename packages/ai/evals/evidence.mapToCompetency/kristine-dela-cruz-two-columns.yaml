# Kristine Dela Cruz's two-column CV as a real PDF's extraction reads it (AIV-P1-155, AIV-P1-156): the skills column's
# lines interleaved with the work history's, skill bars with percentages, dates on a line of their own after the role.
# Synthetic; it imitates the layout problems of six real QA-engineer CVs (owner's local test, 27 Nov 2026; never stored
# in the repo) and none of their content. A quote joined around an interleaved line is not in the source.
# gpt-main joins the Postman line around "EDUCATION" on every run, so that link is dropped (dropInvalidCitations) and
# c-api-testing is not expected; recorded from the product's checked answer (the dropped link left out), as a live run
# scores it, since the raw answer always holds that quote. Live, mapToCompetency@4, 9 runs: never rejected, citation
# validity 100% of kept links, every hard gate 9/9; CV lines rated "claim" not "supporting" on every run, so strength is
# expected by AIV-P1-157 (#655), not here.
id: kristine-dela-cruz-two-columns
people: [Kristine Dela Cruz]
input:
  # A synthetic 8-competency rubric for "QA Automation Engineer" (hiring owner Rashid Al Nuaimi, Head of Quality),
  # written for the real-layout set (AIV-P1-155); the same in every case of the set.
  competencies:
    - id: c-ui-automation
      name: End-to-end UI test automation
      evidenceExpected: A browser test suite the candidate built and keeps running, with its size and what it covers.
    - id: c-api-testing
      name: API test automation
      evidenceExpected: Automated API or contract tests the candidate wrote for real services.
    - id: c-ci
      name: Tests in the delivery pipeline
      evidenceExpected: Tests the candidate wired into CI so they gate a merge or a release.
    - id: c-performance
      name: Performance and load testing
      evidenceExpected: A load or performance test the candidate designed, with the limit it found.
    - id: c-reliability
      name: Test reliability
      evidenceExpected: Flaky tests the candidate found and fixed, with the effect on the pass rate.
    - id: c-strategy
      name: Test strategy
      evidenceExpected: A test strategy or plan the candidate wrote for a product, and what it decided.
    - id: c-defects
      name: Defect reporting and triage
      evidenceExpected: Defect reports the candidate wrote that engineers could reproduce and fix.
    - id: c-mobile
      name: Mobile app testing
      evidenceExpected: Test coverage of an Android or iOS app the candidate built or ran.
sources:
  - id: S1
    kind: cv
    text: |-
      Kristine Dela Cruz
      QA Automation Engineer
      kristine@example.com
      +44 7700 900456
      WORK HISTORY
      SKILLS
      Test Automation Lead
      Playwright ████████░░ 80%
