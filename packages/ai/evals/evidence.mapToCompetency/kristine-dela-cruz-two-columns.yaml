      Cypress ██████░░░░ 60%
      Mar 2022 – Present
      TypeScript ███████░░░ 70%
      Wrote the test strategy for the card onboarding flow and owned its release sign-off.
      Postman █████████░ 90%
      Moved 300 Cypress tests to Playwright and removed the nightly retries.
      k6 ████░░░░░░ 40%
      Added the Playwright suite as a required check on every merge request.
      LANGUAGES
      QA Engineer
      English, Tagalog
      Coral Bay Software, Manila
      CERTIFICATIONS
      Jan 2018 – Feb 2022
      ISTQB Foundation Level
      Wrote Postman collections for 60 payment APIs
      EDUCATION
      and ran them in the build pipeline.
      BS Information Technology, 2017
      Tested the Android and iOS releases by hand before automation was in place.
expected:
  match:
    links[*].competencyId: [c-ui-automation, c-strategy]
    links[*].label: [claim]
  safety:
    forbidden: [strong]
