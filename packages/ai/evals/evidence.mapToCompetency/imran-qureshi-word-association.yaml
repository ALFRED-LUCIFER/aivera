    - id: c-bdd
      name: Behaviour-driven development tooling
      evidenceExpected: Feature files and step definitions the candidate wrote and ran with a BDD tool.
    - id: c-mobile
      name: Mobile app test automation
      evidenceExpected: Automated tests the candidate wrote for an Android or iOS app.
    - id: c-api
      name: REST API testing
      evidenceExpected: Automated tests the candidate wrote against real REST APIs.
    - id: c-regression
      name: Regression testing
      evidenceExpected: Regression cycles the candidate planned or ran before releases.
