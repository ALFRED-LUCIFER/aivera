      Imran Qureshi
      QA Engineer, Harbourline Logistics, 2021 to now
      Worked in two-week sprints with the delivery team.
      Ran manual regression cycles on the shipment tracking web portal before each release.
      Wrote Gherkin feature files for the checkout flows.
