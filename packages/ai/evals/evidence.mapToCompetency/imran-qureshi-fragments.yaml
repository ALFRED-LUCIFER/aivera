# Imran Qureshi's CV laid out like a real PDF's extraction (AIV-P1-155, AIV-P1-156): every sentence broken over 3 to 5
# short lines, bullets (•, -, o) and arrows (➢, →), ligatures inside words. Synthetic; it imitates the layout problems of
# six real QA-engineer CVs (owner's local test, 27 Nov 2026; never stored in the repo) and none of their content.
# A quote is one unbroken run of the source: it may run across a line break, never into an item a bullet opens.
# Live, mapToCompetency@4, 10 runs: never rejected, citation validity 100% of kept links; claim labelling and safety
# failed in 5 of 10 (CV lines labelled submitted or rated Medium or Strong), fixed by AIV-P1-157 (#655).
id: imran-qureshi-fragments
people: [Imran Qureshi]
input:
  # A synthetic 8-competency rubric for "QA Automation Engineer" (hiring owner Rashid Al Nuaimi, Head of Quality),
  # written for the real-layout set (AIV-P1-155); the same in every case of the set.
  competencies:
    - id: c-ui-automation
      name: End-to-end UI test automation
      evidenceExpected: A browser test suite the candidate built and keeps running, with its size and what it covers.
    - id: c-api-testing
      name: API test automation
      evidenceExpected: Automated API or contract tests the candidate wrote for real services.
    - id: c-ci
      name: Tests in the delivery pipeline
      evidenceExpected: Tests the candidate wired into CI so they gate a merge or a release.
    - id: c-performance
      name: Performance and load testing
      evidenceExpected: A load or performance test the candidate designed, with the limit it found.
    - id: c-reliability
      name: Test reliability
      evidenceExpected: Flaky tests the candidate found and fixed, with the effect on the pass rate.
    - id: c-strategy
      name: Test strategy
      evidenceExpected: A test strategy or plan the candidate wrote for a product, and what it decided.
    - id: c-defects
      name: Defect reporting and triage
      evidenceExpected: Defect reports the candidate wrote that engineers could reproduce and fix.
    - id: c-mobile
      name: Mobile app testing
      evidenceExpected: Test coverage of an Android or iOS app the candidate built or ran.
